# tmux — set up 2026-08-24, to hold the two-pane workspace Ghostty opens into.
#
# tmux is here for ONE property: the session outlives the window, so closing the terminal (or the
# Mac sleeping) does not kill a Claude run that is halfway through something.
#
# Everything below exists to hide the rest of tmux. Its default key bindings are the reason people
# find it hard, and none of them are needed for two fixed panes — so the mouse does the work and
# the prefix is left for when it is actually wanted.

# ── Mouse: click a pane to focus it, drag the divider to resize, scroll to scroll back ─────────
set -g mouse on

# ── Thai text ──────────────────────────────────────────────────────────────────────────────────
# Thai vowels and tone marks are COMBINING characters — they occupy no width of their own and sit
# on the consonant before them. A terminal stack that miscounts them puts the cursor in the wrong
# column and the line appears to jump, which is exactly the Terminal.app problem. tmux needs the
# UTF-8 path switched on explicitly for its own width calculations to be right.
set -gq utf8 on
set -gq status-utf8 on
set -g default-terminal "tmux-256color"
# True colour, so the theme and starship colours survive the tmux layer.
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc,xterm-ghostty:Tc"

# ── Feel ───────────────────────────────────────────────────────────────────────────────────────
set -sg escape-time 0        # the default 500ms delay makes Esc feel broken in editors
set -g history-limit 50000   # long Claude output is worth scrolling back through
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Splitting keeps you where you are, rather than jumping to the home directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes without the prefix — these two panes are used constantly.
#
# the moment the banner became a third pane. It sits ABOVE the claude pane, so which one -R lands
# on depends on where the cursor happens to be, and landing on the banner is a dead end: that pane
# runs a `read` that swallows every key with no way to tell you it did.
#
# So these target the panes by WHAT IS RUNNING IN THEM rather than by direction. yazi is always the
# file browser and claude is always the one worth typing into; the banner is never a destination.
# one group nothing else here competes for, and Alt already has a job in this profile: it is the
# meta prefix that makes Shift+Enter work ("Option Key Sends: 2").
#
# Plain -L/-R is correct again now that there are two panes and only two. A previous version
# targeted panes by what was running in them, which existed only to dodge a third pane that no
# longer exists — see the banner note below.
bind -n F1 select-pane -L
bind -n F2 select-pane -R

# ── Selecting text with the mouse ──────────────────────────────────────────────────────────────
#
# yazi asks for mouse reporting (so folders can be clicked), and once it does, tmux hands it every
# click and stops using them for selection. Those two cannot both have a plain drag.
#
# F3 lends the mouse back for one selection: it enters tmux's copy mode, where dragging selects
# normally. Releasing the button copies straight to the SYSTEM clipboard and leaves copy mode, so
# it is one key, one drag, done — no second keystroke to remember.
#
# (Holding Option while dragging also works and needs no config at all: iTerm2 bypasses mouse
# reporting while it is held. F3 exists because that is not discoverable.)
# ⌘⇧C and F3 both enter copy mode. ⌘ never reaches a terminal on its own, so the iTerm2 profile
# turns ⌘⇧C into a private escape sequence and tmux picks it up as a user key. The sequence is
# ESC [ 9 9 ; 6 u — CSI-u form, which nothing else here emits.
set -s user-keys[0] "\033[99;6u"
bind -n User0 copy-mode
bind -n F3 copy-mode
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Escape leaves copy mode without copying.
bind -T copy-mode    Escape send -X cancel
bind -T copy-mode-vi Escape send -X cancel

bind r source-file ~/.tmux.conf \; display "config reloaded"

# ── Pasting a picture: prefix + i ──────────────────────────────────────────────────────────────
#
# ⚠️ Correction, because the wrong version of this note lived here for one commit and would have
# misled the next reader: ctrl+v DOES paste a clipboard image into Claude Code inside tmux. It was
# verified two ways — the keypress arrives as 0x16 with the tty in raw mode, and a real session in
# a tmux pane showed "[Image #1]" after it. The earlier claim that tmux structurally prevents it
# was wrong: the image never travels THROUGH tmux at all. tmux forwards keystrokes; the program on
# the far end reads the macOS pasteboard directly, which works fine from inside a tmux pane
# (pngpaste was used to prove it).
#
# So this binding is not a workaround for a broken ctrl+v. It covers the case ctrl+v cannot:
# plain ⌘⇧4, which writes a FILE to the Desktop and never touches the clipboard. It also leaves a
# reusable PATH in the pane rather than a one-shot attachment, which is what you want when the same
# picture has to be handed to something more than once.
#
# send-keys -l so the path is inserted literally: a filename with a space in it (every macOS
# screenshot has three) must not be re-split by tmux's own key parsing.
bind i run-shell -b 'p=$("$HOME/.local/bin/clip-image-path" 2>/dev/null); \
  if [ -n "$p" ]; then tmux send-keys -l -- "$p "; \
  else tmux display -d 4000 "No image found - Ctrl+Cmd+Shift+4 copies one, Cmd+Shift+4 saves a file"; fi'

# ── Status bar ─────────────────────────────────────────────────────────────────────────────────
# One line, dark, and only what is worth a permanent strip of screen: which folder, and the time.
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[fg=#89b4fa,bold] #S #[default]"
set -g status-left-length 20
set -g status-right "#[fg=#a6e3a1]#{b:pane_current_path} #[fg=#6c7086]· #[fg=#a6adc8]%H:%M "
set -g status-right-length 60
setw -g window-status-current-style "fg=#f9e2af,bold"

# ── The pinned banner: REMOVED 2026-08-24, do not add it back ──────────────────────────────────
# It was a 3-row pane above the claude pane holding the Claude Code mascot and version. It looked
# right and it broke three things at once, none of which were visible from the config:
#
#   - The mouse stopped working in yazi. With three panes, clicks were landing somewhere other
#     than where they looked like they were landing.
#   - Pane switching became necessary at all. With two panes a click is enough; with three, -L/-R
#     depends on cursor position and could land on the banner — a pane running `read`, which
#     swallows every key silently.
#   - yazi appeared to freeze, which was really focus sitting somewhere the owner could not see.
#
# costs a working mouse is not worth any amount of pinned logo. claude-banner is deleted with it.

# The active pane gets a visible border, or with two panes it is easy to type into the wrong one.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g display-time 2000
